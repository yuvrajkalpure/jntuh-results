<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>JNTUH Results</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f5f7fa;

    color: #15171a;
}


body {

    min-height: 100vh;

}


/* --------------------------------
   APP
-------------------------------- */

.app {

    width: 100%;

    min-height: 100vh;

}


/* --------------------------------
   HEADER
-------------------------------- */

.header {

    width: 100%;

    background: #ffffff;

    padding:
        calc(16px + env(safe-area-inset-top))
        16px
        16px;

    border-bottom: 1px solid #e8eaed;

}


.header-inner {

    width: 100%;

    max-width: 700px;

    margin: auto;

}


.title {

    font-size: 24px;

    font-weight: 750;

    margin: 0;

}


.subtitle {

    margin-top: 5px;

    color: #73777d;

    font-size: 14px;

}


/* --------------------------------
   MAIN
-------------------------------- */

main {

    width: 100%;

    padding: 16px;

}


.content {

    width: 100%;

    max-width: 700px;

    margin: auto;

}


/* --------------------------------
   SEARCH CARD
-------------------------------- */

.search-card {

    width: 100%;

    background: #ffffff;

    border-radius: 14px;

    padding: 18px;

    border: 1px solid #e7e9ec;

}


.label {

    display: block;

    font-size: 14px;

    font-weight: 650;

    margin-bottom: 8px;

}


.input {

    width: 100%;

    height: 50px;

    padding: 0 14px;

    border:
        1px solid #d6d9de;

    border-radius: 9px;

    outline: none;

    font-size: 16px;

    background: #fff;

    text-transform: uppercase;

}


.input:focus {

    border-color: #0066cc;

    box-shadow:
        0 0 0 3px
        rgba(0, 102, 204, .10);

}


.search-button {

    width: 100%;

    height: 50px;

    margin-top: 12px;

    border: 0;

    border-radius: 9px;

    background: #0066cc;

    color: white;

    font-size: 16px;

    font-weight: 650;

    cursor: pointer;

}


.search-button:active {

    transform: scale(.99);

}


.search-button:disabled {

    opacity: .6;

    cursor: not-allowed;

}


/* --------------------------------
   STATUS
-------------------------------- */

.status {

    display: none;

    margin-top: 14px;

    padding: 12px;

    border-radius: 9px;

    font-size: 14px;

}


.status.loading {

    display: block;

    background: #eef5ff;

    color: #1458a6;

}


.status.error {

    display: block;

    background: #fff0f0;

    color: #b42318;

}


/* --------------------------------
   HISTORY
-------------------------------- */

.history {

    margin-top: 20px;

}


.history-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 10px;

}


.history-title {

    font-size: 16px;

    font-weight: 700;

}


.clear-history {

    border: 0;

    background: none;

    color: #0066cc;

    font-size: 13px;

    cursor: pointer;

}


.history-list {

    display: flex;

    flex-direction: column;

    gap: 8px;

}


.history-item {

    width: 100%;

    padding: 13px 14px;

    background: white;

    border: 1px solid #e7e9ec;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    cursor: pointer;

}


.history-htno {

    font-size: 15px;

    font-weight: 600;

}


.history-status {

    font-size: 12px;

    color: #777;

}


/* --------------------------------
   RESULT
-------------------------------- */

.result {

    width: 100%;

    margin-top: 18px;

}


.result-card {

    width: 100%;

    background: white;

    border-radius: 14px;

    border: 1px solid #e7e9ec;

    overflow: hidden;

}


.result-heading {

    padding: 16px;

    border-bottom: 1px solid #e7e9ec;

}


.result-title {

    margin: 0;

    font-size: 19px;

    font-weight: 700;

}


.result-htno {

    margin-top: 5px;

    color: #73777d;

    font-size: 13px;

}


/* --------------------------------
   TABLE
-------------------------------- */

.table-wrapper {

    width: 100%;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;
}


.result-table {

    width: 100%;

    border-collapse: collapse;

    min-width: 520px;

}


.result-table th {

    background: #f7f8fa;

    font-size: 13px;

    font-weight: 700;

    white-space: nowrap;

}


.result-table td {

    font-size: 13px;

}


.result-table th,
.result-table td {

    padding: 12px 10px;

    border-bottom:
        1px solid #e8eaed;

    text-align: left;

}


.result-table tr:last-child td {

    border-bottom: 0;

}


/* --------------------------------
   CACHE BADGE
-------------------------------- */

.cache-badge {

    display: inline-block;

    margin-top: 10px;

    padding: 5px 9px;

    border-radius: 20px;

    background: #eef8f1;

    color: #18743c;

    font-size: 11px;

    font-weight: 600;

}


/* --------------------------------
   DESKTOP
-------------------------------- */

@media (min-width: 768px) {

    main {

        padding: 30px;
    }


    .search-card {

        padding: 24px;
    }

}

</style>

</head>


<body>


<div class="app">


<header class="header">

    <div class="header-inner">

        <h1 class="title">
            JNTUH Results
        </h1>

        <div class="subtitle">
            B.Tech Results
        </div>

    </div>

</header>


<main>

<div class="content">


    <!-- SEARCH -->

    <div class="search-card">

        <label
            class="label"
            for="htno"
        >
            Hall Ticket Number
        </label>


        <input
            class="input"
            id="htno"
            type="text"
            placeholder="23E31A0586"
            autocomplete="off"
            autocapitalize="characters"
        >


        <button
            class="search-button"
            id="searchButton"
            onclick="searchResult()"
        >
            Get Result
        </button>


        <div
            id="status"
            class="status"
        ></div>

    </div>


    <!-- HISTORY -->

    <div
        id="history"
        class="history"
    ></div>


    <!-- RESULT -->

    <div
        id="result"
        class="result"
    ></div>


</div>

</main>

</div>


<script>


/* --------------------------------
   HISTORY STORAGE
-------------------------------- */

const HISTORY_KEY =
    "jntuh_result_history";


function getHistory() {

    try {

        return JSON.parse(
            localStorage.getItem(
                HISTORY_KEY
            )
        ) || [];

    } catch {

        return [];

    }

}


function saveHistory(htno) {

    let history =
        getHistory();


    /*
     * Remove duplicate
     */

    history =
        history.filter(
            item => item !== htno
        );


    /*
     * Add newest first
     */

    history.unshift(htno);


    /*
     * Keep only last 10
     */

    history =
        history.slice(0, 10);


    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
    );


    renderHistory();

}


function clearHistory() {

    localStorage.removeItem(
        HISTORY_KEY
    );

    renderHistory();

}


function renderHistory() {

    const historyContainer =
        document.getElementById(
            "history"
        );


    const history =
        getHistory();


    if (history.length === 0) {

        historyContainer.innerHTML = "";

        return;

    }


    let html = `

        <div class="history-header">

            <div class="history-title">
                Recent Searches
            </div>

            <button
                class="clear-history"
                onclick="clearHistory()"
            >
                Clear
            </button>

        </div>

        <div class="history-list">

    `;


    history.forEach(htno => {

        html += `

            <div
                class="history-item"
                onclick="useHistory('${htno}')"
            >

                <span class="history-htno">
                    ${escapeHtml(htno)}
                </span>

                <span class="history-status">
                    View
                </span>

            </div>

        `;

    });


    html += `
        </div>
    `;


    historyContainer.innerHTML =
        html;

}


function useHistory(htno) {

    document.getElementById(
        "htno"
    ).value = htno;


    searchResult();

}


/* --------------------------------
   SEARCH
-------------------------------- */

async function searchResult() {


    const input =
        document.getElementById(
            "htno"
        );


    const button =
        document.getElementById(
            "searchButton"
        );


    const status =
        document.getElementById(
            "status"
        );


    const result =
        document.getElementById(
            "result"
        );


    const htno =
        input.value
            .trim()
            .toUpperCase();


    result.innerHTML = "";

    status.className =
        "status";


    if (!htno) {

        showError(
            "Please enter your Hall Ticket Number."
        );

        return;

    }


    button.disabled = true;


    status.className =
        "status loading";


    status.textContent =
        "Fetching result...";


    try {


        const response =
            await fetch(
                `/api/result?htno=${encodeURIComponent(htno)}`
            );


        const data =
            await response.json();


        if (!response.ok ||
            !data.success) {

            throw new Error(
                data.message ||
                "Unable to get result."
            );

        }


        /*
         * Save to browser history
         */

        saveHistory(htno);


        /*
         * Display result
         */

        displayResult(data);


        /*
         * Show cache status
         */

        if (data.cached) {

            status.className =
                "status loading";

            status.textContent =
                "Loaded from cache.";

        } else {

            status.className =
                "status";

            status.textContent =
                "";

        }


    } catch (error) {


        console.error(error);


        showError(
            error.message ||
            "Something went wrong."
        );


    } finally {

        button.disabled = false;

    }

}


/* --------------------------------
   RESULT UI
-------------------------------- */

function displayResult(data) {


    const result =
        document.getElementById(
            "result"
        );


    let tableHTML = `

        <div class="table-wrapper">

            <table class="result-table">

    `;


    data.table.forEach(
        (row, rowIndex) => {

            tableHTML += "<tr>";


            row.forEach(cell => {

                const tag =
                    rowIndex === 0
                        ? "th"
                        : "td";


                tableHTML += `

                    <${tag}>
                        ${escapeHtml(cell)}
                    </${tag}>

                `;

            });


            tableHTML += "</tr>";

        }
    );


    tableHTML += `

            </table>

        </div>

    `;


    result.innerHTML = `

        <div class="result-card">

            <div class="result-heading">

                <h2 class="result-title">
                    Result
                </h2>

                <div class="result-htno">
                    HTNO:
                    <strong>
                        ${escapeHtml(data.htno)}
                    </strong>
                </div>

                ${
                    data.cached
                    ? `
                        <span class="cache-badge">
                            Cached result
                        </span>
                    `
                    : ""
                }

            </div>

            ${tableHTML}

        </div>

    `;

}


/* --------------------------------
   ERROR
-------------------------------- */

function showError(message) {

    const status =
        document.getElementById(
            "status"
        );


    status.className =
        "status error";


    status.textContent =
        message;

}


/* --------------------------------
   SECURITY
-------------------------------- */

function escapeHtml(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* --------------------------------
   INITIALIZE
-------------------------------- */

renderHistory();


/*
 * Press Enter to search
 */

document
    .getElementById("htno")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                searchResult();

            }

        }
    );

</script>


</body>

    </html>
